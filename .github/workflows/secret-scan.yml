# Secret scanning for the HZDR fork.
#
# The eight GitLab-hosted repositories in this constellation get this from
# `include: template: Security/Secret-Detection.gitlab-ci.yml`. This repository
# is on GitHub, so it needs its own equivalent -- without it the fork was the
# largest unscanned publication surface in the family.
#
# Two different questions, so two scans:
#
#   tree     what a fresh clone exposes today. Runs on every push and PR.
#   history  what anyone who clones can still read out of an old commit.
#            A secret deleted in a later commit is still there. Too slow and
#            too noisy for every PR, so it runs weekly and on demand.
#
# Findings are blocking. Everything currently known to be a false positive is
# recorded with its reasoning in `.gitleaks.toml`, so a new finding means
# something genuinely new. Do not silence a red build by widening that file
# without triaging the finding first.
#
# The version is pinned to match `scripts/secret-scan.ps1` in the HZDR_combo
# meta-repository, so a maintainer reproducing a finding locally gets the same
# answer as CI.

name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 04:17 UTC. Off the hour, because scheduled runs that pile up on
    # :00 get queued behind everyone else's.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
      DEEP: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The history scan needs every commit; the tree scan does not care.
          # Quoted deliberately: GitHub casts a bare 0 to false, so
          # `cond && 0 || 1` would evaluate to 1 even when cond is true.
          fetch-depth: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '0' || '1' }}

      - name: Materialise the tracked tree at HEAD
        # Never point `gitleaks dir` at the working checkout. It walks
        # node_modules, .venv, build output and caches -- none of which are
        # published, all of which bury the real findings. `git archive` gives
        # exactly the tracked files and nothing else.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"

      - name: Scan the tree at HEAD
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/tree:/scan" -w /scan \
            -v "$GITHUB_WORKSPACE:/out" \
            "$GITLEAKS_IMAGE" dir . \
              --redact --no-banner --config .gitleaks.toml \
              --report-format sarif --report-path /out/gitleaks-tree.sarif

      - name: Scan the full history
        if: env.DEEP == 'true'
        run: |
          set -euo pipefail
          # gitleaks shells out to git, and the container's root does not own
          # the checkout, so git refuses it as "dubious ownership" without this.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/scan" -w /scan \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" git . \
              --redact --no-banner --config .gitleaks.toml \
              --report-format sarif --report-path /scan/gitleaks-history.sarif

      - name: Upload reports
        # Reports are written redacted, so they carry no secret values and are
        # safe to attach to a run. Kept short: they are triage aids, not
        # release evidence.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: |
            gitleaks-tree.sarif
            gitleaks-history.sarif
          if-no-files-found: ignore
          retention-days: 14
